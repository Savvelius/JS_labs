<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список объявлений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="app.js" defer></script>
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 700px;">
        <h1 class="mb-4">Платформа объявлений</h1>
        <div class="card p-3 mb-4">
            <h2 id="formTitle" class="h4 mb-3">Добавление объявления</h2>
            <form id="addForm">
                <div class="mb-2">
                    <label for="addName" class="form-label">Введите название</label>
                    <input id="addName" type="text" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="addDesc" class="form-label">Введите описание</label>
                    <input id="addDesc" type="text" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="addPrice" class="form-label">Введите цену</label>
                    <input id="addPrice" type="number" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="addImg" class="form-label">Прикрепите изображение</label>
                    <input id="addImg" type="file" accept="image/*" class="form-control">
                </div>
                <button id="submitBtn" type="submit" class="btn btn-primary">Добавить</button>
            </form>
            <p id="addOutput" class="mt-2 mb-0"></p>
        </div>

        <h2 class="h4 mb-3">Список объявлений</h2>
        <div id="adList"></div>
    </div>
</body>
</html>
